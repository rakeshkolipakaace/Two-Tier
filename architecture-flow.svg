<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#00f2ff"/>
      <stop offset="1" stop-color="#0066ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: #040914; }
      .panel { fill: rgba(10,25,45,0.6); stroke: #053b66; stroke-width:2; rx:8; }
      .text { fill: #cfefff; font-family: Inter, Arial, sans-serif; font-size:13px; }
      .mono { font-family: "Courier New", monospace; font-size:12px; fill:#9fe8ff; }
      .node { fill: url(#g1); stroke:#003b66; stroke-width:2; rx:6; }
      .cyl { fill: #013b66; stroke: #00b3ff; stroke-width:2; }
      .arrow { stroke: url(#g1); stroke-width:4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
      .pulse { filter: url(#glow); }
      .fade { opacity:0.85; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <!-- left values.yaml panel -->
  <g transform="translate(30,50)">
    <rect width="240" height="300" class="panel"/>
    <text x="18" y="28" class="text" font-weight="700">values.yaml</text>
    <g transform="translate(12,48)">
      <text class="mono">global:</text>
      <text class="mono" y="20">  environment: production</text>
      <text class="mono" y="40">web:</text>
      <text class="mono" y="60">  replicaCount: 2</text>
      <text class="mono" y="80">  image: flask-app:1.2</text>
      <text class="mono" y="100">db:</text>
      <text class="mono" y="120">  image: mysql:8.0</text>
      <text class="mono" y="140">  persistentVolume: true</text>
    </g>
  </g>

  <!-- Helm center node -->
  <g transform="translate(310,170)">
    <circle r="44" class="node pulse" cx="44" cy="44"/>
    <text x="16" y="50" class="text" font-weight="700">HELM</text>
  </g>

  <!-- templates/manifests stack -->
  <g transform="translate(420,40)">
    <rect width="220" height="120" class="panel"/>
    <text x="14" y="22" class="text" font-weight="700">templates</text>
    <rect x="16" y="36" width="188" height="28" class="panel" style="fill:rgba(5,52,86,0.6);stroke:#0b5f8f"/>
    <text x="26" y="56" class="mono">deployment.yaml</text>
    <rect x="16" y="70" width="188" height="28" class="panel" style="fill:rgba(5,52,86,0.5);stroke:#0b5f8f"/>
    <text x="26" y="90" class="mono">service.yaml</text>
  </g>

  <!-- right pods/cylinders -->
  <g transform="translate(660,60)">
    <!-- flask app cyl 1 -->
    <g transform="translate(-120,24)">
      <ellipse cx="40" cy="12" rx="40" ry="12" class="cyl" />
      <rect x="0" y="12" width="80" height="80" class="cyl" rx="6"/>
      <ellipse cx="40" cy="92" rx="40" ry="12" class="cyl" />
      <text x="8" y="48" class="text">Flask Web App</text>
      <text x="8" y="64" class="mono">pod: web-replica-1</text>
    </g>
    <!-- mysql cylinder -->
    <g transform="translate(-120,140)">
      <ellipse cx="40" cy="12" rx="40" ry="12" style="fill:#002b3f;stroke:#00a0e0;stroke-width:2"/>
      <rect x="0" y="12" width="80" height="80" style="fill:#001b2b;stroke:#00a0e0;stroke-width:2" rx="6"/>
      <ellipse cx="40" cy="92" rx="40" ry="12" style="fill:#002b3f;stroke:#00a0e0;stroke-width:2"/>
      <text x="18" y="48" class="text">MySQL</text>
      <text x="8" y="64" class="mono">pod: db-master-0</text>
    </g>
    <text x="-120" y="240" class="mono">PersistentVolume (5Gi)</text>
  </g>

  <!-- arrows animated -->
  <path id="a1" d="M270 200 L310 200" class="arrow"/>
  <path id="a2" d="M398 170 L420 100" class="arrow"/>
  <path id="a3" d="M540 140 L620 110" class="arrow"/>
  <path id="a4" d="M540 200 L620 200" class="arrow"/>

  <!-- arrowheads -->
  <marker id="m" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
    <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#00bfff"/>
  </marker>
  <style>
    #a1, #a2, #a3, #a4 { marker-end: url(#m); stroke-dasharray: 12 8; }
  </style>

  <!-- animation: dashoffset to create pulsing movement along arrows -->
  <animate xlink:href="#a1" attributeName="stroke-dashoffset" from="0" to="-20" dur="1.1s" repeatCount="indefinite"/>
  <animate xlink:href="#a2" attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite" begin="0.15s"/>
  <animate xlink:href="#a3" attributeName="stroke-dashoffset" from="0" to="-32" dur="1.0s" repeatCount="indefinite" begin="0.3s"/>
  <animate xlink:href="#a4" attributeName="stroke-dashoffset" from="0" to="-18" dur="1.4s" repeatCount="indefinite" begin="0.5s"/>

  <!-- glow pulses on nodes -->
  <animate xlink:href="#a1" attributeName="opacity" values="1;0.6;1" dur="2.4s" repeatCount="indefinite"/>
  <animate xlink:href="#a2" attributeName="opacity" values="1;0.6;1" dur="2.6s" repeatCount="indefinite" begin="0.1s"/>
  <animate xlink:href="#a3" attributeName="opacity" values="1;0.6;1" dur="2.2s" repeatCount="indefinite" begin="0.2s"/>

  <animate xlink:href="#a4" attributeName="opacity" values="1;0.7;1" dur="3s" repeatCount="indefinite" begin="0.4s"/>

  <!-- Helm node glow pulse -->
  <g>
    <circle cx="354" cy="214" r="64" fill="none" stroke="url(#g1)" stroke-width="2" opacity="0.08">
      <animate attributeName="opacity" values="0.08;0.25;0.08" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="64;74;64" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- small legend -->
  <g transform="translate(30,370)">
    <text class="mono">Animation: pulsing flow • Size: 800×450</text>
  </g>
</svg>
